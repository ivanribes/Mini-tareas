spring:
  config:
    import: optional:classpath:application-local.yaml
  application:
    name: tareas
  datasource:
    url: jdbc:postgresql://postgres:5432/minitareas_db
    username: minitareas_user
    password: password123
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
management:
  endpoints:
    web:
      exposure:
        include: health
tareas:
  jwt:
    expiration-minutes: 60
springdoc:
  swagger-ui:
    persist-authorization: true